name: Publish Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. v0.2.0-preview.1'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-preview\.\d+)?$') { throw 'Unsupported release tag' }
          "RELEASE_TAG=$env:RELEASE_TAG" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake -S . -B build -A x64 "-DFLUXTOP_RELEASE_TAG:STRING=${{ env.RELEASE_TAG }}"
      - name: Build
        run: cmake --build --preset release
      - name: Test and package
        shell: pwsh
        run: ./tools/Package-Release.ps1
      - name: Publish verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          & ./tools/Get-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG -OutputPath $notesPath
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw 'Release notes file missing' }
          if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notesPath -Raw))) { throw 'Release notes file empty' }
          $arguments=@('release','create',$env:RELEASE_TAG,'out/release/FluxTop.exe','out/release/SHA256SUMS.txt','out/release/LICENSE.txt',
            '--verify-tag','--title',"FluxTop $env:RELEASE_TAG",'--notes-file',$notesPath)
          if ($env:RELEASE_TAG -like '*-preview.*') { $arguments+='--prerelease' }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
