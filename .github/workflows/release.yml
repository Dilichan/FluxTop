name: Publish Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. v0.2.0-preview.1'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate tag and prepare release notes
        run: cmake -DROOT=. "-DTAG=%RELEASE_TAG%" -DOUTPUT=build/release-notes.md -P tools/Get-ReleaseNotes.cmake
      - name: Configure
        run: cmake -S . -B build -A x64 "-DFLUXTOP_RELEASE_TAG:STRING=%RELEASE_TAG%"
      - name: Build Release
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release --output-on-failure
      - name: Package verified assets
        run: cmake -DROOT=. -DBUILD_DIRECTORY=build -DOUTPUT_DIR=out/release -DCONFIG=Release -P tools/Package-Release.cmake
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "%RELEASE_TAG%"
          "out/release/FluxTop.exe"
          "out/release/SHA256SUMS.txt"
          "out/release/LICENSE.txt"
          --verify-tag
          --title "FluxTop %RELEASE_TAG%"
          --notes-file "build/release-notes.md"
          ${{ contains(env.RELEASE_TAG, '-preview.') && '--prerelease' || '' }}