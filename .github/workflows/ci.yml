name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset windows
      - name: Build Release
        run: cmake --build --preset release
      - name: Test including native JSONL and installer fixtures
        run: ctest --preset release --output-on-failure
      # Git source-launcher remains PowerShell in stage 1; do not drop its integration coverage.
      - name: Test Git updater with local repositories
        shell: powershell
        run: ./tests/update_tests.ps1
      - name: Test launcher fallback and locking
        shell: powershell
        run: ./tests/launcher_tests.ps1
      - name: Test elevation policy without opening UAC
        shell: powershell
        run: ./tests/elevation_tests.ps1
      - name: Package downloadable EXE with CMake
        shell: cmd
        run: cmake -DROOT=. -DBUILD_DIRECTORY=build -DOUTPUT_DIR=out/release -DCONFIG=Release -P tools/Package-Release.cmake
      - uses: actions/upload-artifact@v4
        with:
          name: FluxTop-windows-x64
          path: out/release/*
          if-no-files-found: error